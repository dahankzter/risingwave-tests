# Optional convenience for running the bench cluster. The Makefile (`make up`) is the supported
# path and needs nothing but podman; this file exists for people who already have a compose
# provider and prefer it.
#
# `podman compose` does NOT include a provider -- it shells out to docker-compose or
# podman-compose, and fails with "looking up compose provider failed" when neither is installed.
# That is why this file was dropped once before. Install one, or just use `make up`.
#
#   podman compose up -d          # or: docker compose up -d
#   podman compose down           # add -v to drop the data volume
#
# Deliberately kept consistent with the Makefile so the two are interchangeable: same container
# name, same volume name, same pinned image. `make logs`, `make down`, `make clean`, `make psql`
# and `make smoke` all work against a cluster started from here.
#
# Keep RW_IMAGE in step with the Makefile when repinning.

services:
  risingwave:
    image: ${RW_IMAGE:-ghcr.io/dahankzter/risingwave:latest}
    # `latest` is a moving tag, so a cached copy is not good enough -- mirrors the Makefile's
    # --pull=newer. Override RW_IMAGE with a sha tag to pin a run.
    pull_policy: always
    container_name: rw-tests
    # See the Makefile: the metrics endpoint binds loopback inside the container unless told
    # otherwise, which makes the published port unreachable.
    command: single_node --prometheus-listener-addr 0.0.0.0:1260
    # The published images are linux/amd64 only; on Apple Silicon this runs emulated, which is
    # fine for semantics but meaningless for the perf and latency targets.
    platform: linux/amd64
    ports:
      - "4566:4566"   # SQL (pgwire)
      - "5690:5690"   # meta dashboard
      - "1260:1260"   # single_node Prometheus (operator metrics scrape; NOT 1222)
    volumes:
      - rw-tests-data:/root/.risingwave
    healthcheck:
      # /dev/tcp is a bash builtin, so this needs bash (present in the image) rather than the
      # CMD-SHELL default of /bin/sh, and the redirect has to actually be a redirect.
      test: ["CMD", "bash", "-c", "printf '' > /dev/tcp/127.0.0.1/4566"]
      interval: 2s
      timeout: 2s
      retries: 90     # first boot on a cold volume takes well over a minute

volumes:
  rw-tests-data:
    # Pin the real volume name: compose would otherwise prefix it with the project name, and
    # `make clean` (which removes rw-tests-data) would silently miss it.
    name: rw-tests-data
