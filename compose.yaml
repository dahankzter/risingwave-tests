services:
  risingwave:
    image: ${RW_IMAGE:-ghcr.io/dahankzter/risingwave:v3.1.0-alpha--mr--0bc2acb--feat-match-recognize-v2}
    # The published images are linux/amd64 only; on Apple Silicon podman runs them emulated —
    # fine for smoke and semantics runs, meaningless for performance numbers (use the rig).
    platform: linux/amd64
    command: single_node
    ports:
      - "4566:4566" # SQL (pgwire)
      - "5690:5690" # meta dashboard
    volumes:
      - rw-data:/root/.risingwave
    healthcheck:
      test: ["CMD-SHELL", "printf '' /dev/tcp/127.0.0.1/4566 || exit 1"]
      interval: 2s
      timeout: 2s
      retries: 30

volumes:
  rw-data:
